<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Chat Assistant</title>
    <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>
    <h1>AI Chat Assistant</h1>

    <div class="input-area">
    <input id="messageInput" type="text" placeholder="请输入你的问题" onkeydown="handleKeyDown(event)">
    <button id="sendButton" onclick="sendMessage()">发送</button>
    <button id="clearButton" onclick="clearConversation()">清空会话</button>
    </div>
    <div id="chatBox"></div>

<script src="/frontend/app.js"></script>
    
</body>
</html>
