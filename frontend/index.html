<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Chat Assistant</title>
</head>
<body>
    <h1>AI Chat Assistant</h1>

    <input id="messageInput" type="text" placeholder="请输入你的问题" onkeydown="handleKeyDown(event)">
    <button id="sendButton" onclick="sendMessage()">发送</button>

    <div id="chatBox"></div>

    <script>
        const messages = [];
        function handleKeyDown(event) {
        if (event.key === "Enter") {
            sendMessage();
        }}
        async function sendMessage() {
            const input = document.getElementById("messageInput");
            const chatBox = document.getElementById("chatBox");
            const sendButton=document.getElementById("sendButton");
            const userText = input.value.trim();
            if(userText ===""){return;}

            const userMessage = document.createElement("div");
            userMessage.innerText = "用户：" + userText;
            chatBox.appendChild(userMessage);

            messages.push({
                role: "user",
                content: userText
            });
            const aiMessage = document.createElement("div");
            aiMessage.innerText = "AI 正在思考...";
            chatBox.appendChild(aiMessage);
            sendButton.disabled = true;
            sendButton.innerText = "发送中...";
            try{ response = await fetch("http://127.0.0.1:8000/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    messages: messages
                })
            });

            const data = await response.json();
            aiMessage.innerText = "AI：" + data.answer;
            chatBox.appendChild(aiMessage);}
            catch(error)
            {
                 aiMessage.innerText = "请求失败，请检查后端服务是否正常运行。";
            }
             finally{   
            sendButton.disabled = false;
            sendButton.innerText = "发送";}
            messages.push({
                role: "assistant",
                content: data.answer
            });

            input.value = "";
        }
    </script>
</body>
</html>
