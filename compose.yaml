services:
  app:
    build: .
    container_name: ai-chat-assistant
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
     - ai-chat-data:/data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval  : 30s
      timeout : 5s
      retries : 3
      start_period: 10s

volumes:
  ai-chat-data:
    external: true